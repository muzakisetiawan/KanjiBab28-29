<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>和 Flashcards — Belajar 82 Kotoba &amp; Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --gap: 10px;
    --ease: cubic-bezier(.22,.9,.3,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:#e8e2da;
    font-family:'Poppins','Noto Sans JP',sans-serif;
  }
  button, input{ font:inherit; }

  /* ============ FURIGANA & KANJI TYPOGRAPHY ============ */
  ruby { ruby-align: center; }
  rt { font-size: 0.58em; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; color: var(--accent-indigo); letter-spacing: 0; line-height: 1; }

  /* ============ THEME TOKENS ============ */
  .app{
    --bg-sky-top: #ffe7ec;
    --bg-sky-mid: #fff1ea;
    --bg-sky-bot: #fdf7f0;
    --ink: #2b241f;
    --ink-soft: #7a6d64;
    --ink-faint: #a89a90;
    --card-bg: #ffffff;
    --card-bg-soft: #fffaf6;
    --card-border: rgba(43,36,31,0.08);
    --accent-sakura: #e78fa6;
    --accent-sakura-deep: #d1637e;
    --accent-indigo: #3d5a78;
    --accent-gold: #c69657;
    --fuji-fill: #b7c3da;
    --fuji-snow: #ffffff;
    --hill-fill: #cdd9c9;
    --tower-color: #9fb0c9;
    --shadow-soft: 0 10px 24px rgba(70,45,40,0.08);
    --shadow-card: 0 12px 30px rgba(70,45,40,0.10);
    --color-correct: #4f9d6e;
    --color-wrong: #c65c56;
    --sun-op: 1; --moon-op: 0; --star-op: 0; --bird-op: .55;
    --transition: background .5s var(--ease), color .5s var(--ease), border-color .5s var(--ease);
    --font-kanji: 'Noto Sans JP', sans-serif;
  }
  .app[data-theme="dark"]{
    --bg-sky-top: #171a30;
    --bg-sky-mid: #10101f;
    --bg-sky-bot: #0b0b14;
    --ink: #f2ede4;
    --ink-soft: #b6aec2;
    --ink-faint: #6c6480;
    --card-bg: #1b1d30;
    --card-bg-soft: #20223a;
    --card-border: rgba(244,239,231,0.09);
    --accent-sakura: #e6a3b8;
    --accent-sakura-deep: #f0b6c7;
    --accent-indigo: #9fc0e8;
    --accent-gold: #e3c283;
    --fuji-fill: #232544;
    --fuji-snow: #3a3c66;
    --hill-fill: #191a30;
    --tower-color: #cba15f;
    --shadow-soft: 0 10px 24px rgba(0,0,0,0.4);
    --shadow-card: 0 14px 34px rgba(0,0,0,0.48);
    --color-correct: #7fd9a0;
    --color-wrong: #f08a86;
    --sun-op: 0; --moon-op: 1; --star-op: 1; --bird-op: 0;
  }

  /* ============ SHELL ============ */
  .app{
    position:relative; width:100%; max-width:420px; min-height:100dvh;
    overflow-x:hidden; overflow-y:auto;
    background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-mid) 45%, var(--bg-sky-bot) 100%);
    color:var(--ink); transition:var(--transition);
    box-shadow: 0 0 50px rgba(0,0,0,0.15);
  }
  .scenery{ position:absolute; top:0; left:0; right:0; height:180px; overflow:hidden; pointer-events:none; z-index:0; }
  .scenery svg{ width:100%; height:100%; display:block; }
  .scenery .sun-disc{ opacity:var(--sun-op); transition:opacity .6s var(--ease); }
  .scenery .moon-disc{ opacity:var(--moon-op); transition:opacity .6s var(--ease); }
  .scenery .stars{ opacity:var(--star-op); transition:opacity .6s var(--ease); }
  .scenery .birds{ opacity:var(--bird-op); transition:opacity .6s var(--ease); }
  .scenery .fuji-body{ fill:var(--fuji-fill); transition:fill .5s var(--ease); }
  .scenery .fuji-snow{ fill:var(--fuji-snow); transition:fill .5s var(--ease); }
  .scenery .hill{ fill:var(--hill-fill); transition:fill .5s var(--ease); }
  .scenery .tower-lines{ stroke:var(--tower-color); transition:stroke .5s var(--ease); }

  .petals{ position:absolute; inset:0; height:280px; z-index:1; pointer-events:none; overflow:hidden; }
  .petal{ position:absolute; top:-10%; width:8px; height:8px; background:var(--accent-sakura); border-radius:0 100% 0 100%; opacity:.7; animation: fall linear infinite; transition: background .5s var(--ease); }
  @keyframes fall{ 0%{ transform: translate(0,0) rotate(0deg);} 100%{ transform: translate(var(--drift,30px), 280px) rotate(340deg);} }

  /* ============ TOPBAR & CONTROLS ============ */
  .content{ position:relative; z-index:2; padding: 14px 14px 24px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{ font-family:'Noto Sans JP',sans-serif; font-size:10px; letter-spacing:.14em; font-weight:600; color:var(--ink-soft); text-transform:uppercase; }
  .brand .title{ display:flex; align-items:baseline; gap:6px; font-family:'Zen Kaku Gothic New','Poppins',sans-serif; font-weight:900; font-size:20px; color:var(--ink); }
  .brand .rule{ width:30px; height:2.5px; border-radius:2px; margin-top:3px; background: linear-gradient(90deg, var(--accent-gold), var(--accent-sakura)); }

  .topbar-actions{ display:flex; align-items:center; gap:6px; }
  
  .live-counter{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--card-bg); border:1px solid var(--card-border);
    padding:5px 9px; border-radius:999px;
    box-shadow:var(--shadow-soft);
    font-family:'Poppins',sans-serif; font-size:10.5px; font-weight:600;
    color:var(--ink); transition:var(--transition);
    white-space:nowrap;
  }
  .pulse-dot{
    width:6px; height:6px; background-color:#22c55e; border-radius:50%;
    box-shadow:0 0 0 0 rgba(34,197,94,0.7);
    animation:livePulse 1.8s infinite cubic-bezier(0.66,0,0,1);
    flex-shrink:0;
  }
  @keyframes livePulse{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,0.7); }
    70%{ box-shadow:0 0 0 6px rgba(34,197,94,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); }
  }

  .icon-action-btn{
    width:30px; height:26px; border-radius:999px;
    border:1px solid var(--card-border); background:var(--card-bg);
    box-shadow:var(--shadow-soft); cursor:pointer; display:flex;
    align-items:center; justify-content:center; color:var(--ink-soft);
    transition:var(--transition); flex-shrink:0; padding:0;
  }
  .icon-action-btn svg{ width:13px; height:13px; stroke:currentColor; }
  .icon-action-btn:hover{ color:var(--ink); border-color:var(--accent-indigo); }

  .theme-toggle{ position:relative; width:48px; height:26px; border-radius:999px; border:1px solid var(--card-border); background:var(--card-bg); box-shadow: var(--shadow-soft); cursor:pointer; display:flex; align-items:center; padding:2px; transition:var(--transition); flex-shrink:0; }
  .theme-toggle .knob{ width:20px; height:20px; border-radius:50%; background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); display:flex; align-items:center; justify-content:center; transform: translateX(0); transition: transform .4s var(--ease); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .app[data-theme="dark"] .theme-toggle .knob{ transform: translateX(22px); }
  .theme-toggle .knob svg{ width:11px; height:11px; }
  .theme-toggle .icon-static{ position:absolute; }
  .theme-toggle .icon-static.sun{ left:6px; } .theme-toggle .icon-static.moon{ right:5px; }
  .theme-toggle .icon-static svg{ width:11px; height:11px; opacity:.55; }
  .theme-toggle .icon-static.sun svg{ stroke:var(--accent-gold); }
  .theme-toggle .icon-static.moon svg{ stroke:var(--accent-indigo); }

  /* ============ SCREEN TRANSITION ============ */
  .screen-inner{ animation: screenIn .35s var(--ease); }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* ============ BENTO BASE ============ */
  .bento-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .bento{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); transition:var(--transition); }
  .span-2{ grid-column: 1 / -1; }

  .stat-tile{ padding:14px 14px 12px; display:flex; flex-direction:column; gap:8px; }
  .stat-tile .icon-wrap{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background: linear-gradient(155deg, rgba(198,150,87,.16), rgba(231,143,166,.16)); }
  .stat-tile .icon-wrap svg{ width:16px; height:16px; stroke:var(--accent-gold); }
  .stat-tile.learned .icon-wrap svg{ stroke:var(--accent-indigo); }
  .stat-tile .num{ font-family:'Poppins',sans-serif; font-weight:700; font-size:20px; line-height:1; color:var(--ink); }
  .stat-tile .num .unit{ font-size:12px; font-weight:500; color:var(--ink-soft); margin-left:2px; }
  .stat-tile .cap{ font-family:'Noto Sans JP',sans-serif; font-size:11px; color:var(--ink-soft); font-weight:500; }

  .section-label{ font-family:'Noto Sans JP',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; margin: 16px 2px 8px; }

  .progress-bar{ width:100%; height:4px; border-radius:4px; background:var(--card-border); overflow:hidden; }
  .progress-bar span{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent-gold),var(--accent-sakura)); transition:width .4s var(--ease); }

  /* Accent styling */
  .accent-gold .emblem, .accent-gold .g-icon, .g-icon.accent-gold{ background:linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); }
  .accent-indigo .emblem, .accent-indigo .g-icon, .g-icon.accent-indigo{ background:linear-gradient(155deg, var(--accent-indigo), var(--accent-gold)); }
  .accent-sakura .emblem, .accent-sakura .g-icon, .g-icon.accent-sakura{ background:linear-gradient(155deg, var(--accent-sakura-deep), var(--accent-indigo)); }
  .accent-gold{ --tile-glow: var(--accent-gold); }
  .accent-indigo{ --tile-glow: var(--accent-indigo); }
  .accent-sakura{ --tile-glow: var(--accent-sakura-deep); }

  /* ============ HERO TILES ============ */
  .bab-tile{ display:block; width:100%; text-align:left; border:1px solid var(--card-border); background:var(--card-bg); border-radius:var(--radius-xl); padding:16px; box-shadow:var(--shadow-soft); cursor:pointer; position:relative; overflow:hidden; margin-bottom:12px; color:var(--ink); }
  .bab-tile .glow{ position:absolute; width:150px; height:150px; border-radius:50%; filter:blur(6px); opacity:.3; top:-50px; right:-40px; background: radial-gradient(circle, var(--tile-glow, var(--accent-indigo)), transparent 70%); }
  .bab-tile .emblem{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; position:relative; z-index:1; box-shadow:0 6px 14px rgba(0,0,0,.10); }
  .bab-tile .emblem svg{ width:22px; height:22px; stroke:#fff; }
  .bab-tile .eyebrow{ position:relative; z-index:1; font-family:'Noto Sans JP',sans-serif; font-size:10px; letter-spacing:.12em; font-weight:600; color:var(--ink-faint); text-transform:uppercase; }
  .bab-tile .bab-title{ position:relative; z-index:1; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:17px; margin:3px 0 5px; color:var(--ink); line-height:1.25; }
  .bab-tile .bab-desc{ position:relative; z-index:1; font-family:'Noto Sans JP',sans-serif; font-size:11.5px; color:var(--ink-soft); line-height:1.45; margin-bottom:12px; }
  .bab-tile .bab-meta{ position:relative; z-index:1; display:flex; gap:14px; margin-bottom:10px; }
  .bab-tile .bab-meta .meta-num{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--ink); }
  .bab-tile .bab-meta .meta-label{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; color:var(--ink-faint); }
  .bab-tile .bab-progress{ position:relative; z-index:1; }

  .bab-tile.accent-indigo{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-indigo) 18%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-gold) 8%, var(--card-bg)) 100%); border-color: color-mix(in srgb, var(--accent-indigo) 30%, var(--card-border)); }
  .bab-tile.accent-sakura{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-sakura-deep) 18%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-indigo) 8%, var(--card-bg)) 100%); border-color: color-mix(in srgb, var(--accent-sakura-deep) 30%, var(--card-border)); }
  .bab-tile.accent-gold{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-gold) 18%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-gold) 30%, var(--card-border)) 100%); border-color: color-mix(in srgb, var(--accent-gold) 30%, var(--card-border)); }

  .bab-tile.test-cta{
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent-indigo) 18%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-sakura-deep) 12%, var(--card-bg)) 50%, color-mix(in srgb, var(--accent-gold) 12%, var(--card-bg)) 100%);
    border-color: color-mix(in srgb, var(--accent-indigo) 30%, var(--card-border));
    --tile-glow: var(--accent-indigo);
  }
  .bab-tile.test-cta .emblem{ background: linear-gradient(155deg, var(--accent-indigo), var(--accent-sakura-deep)); }

  /* ============ GROUP ROWS ============ */
  .group-row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); padding:12px; box-shadow:var(--shadow-soft); cursor:pointer; margin-bottom:8px; }
  .group-row .g-icon{ width:40px; height:40px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .group-row .g-icon svg{ width:18px; height:18px; stroke:#fff; }
  .group-row .g-body{ flex:1; min-width:0; }
  .group-row .g-title{ font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:1px; }
  .group-row .g-desc{ font-family:'Noto Sans JP',sans-serif; font-size:11px; color:var(--ink-soft); margin-bottom:5px; line-height:1.35; }
  .group-row .g-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .group-row .g-tag{ font-family:'Poppins',sans-serif; font-size:9px; font-weight:600; padding:2px 7px; border-radius:999px; background:var(--card-bg-soft); color:var(--ink-soft); border:1px solid var(--card-border); white-space:nowrap; }
  .group-row .g-tag.page-tag{ background:rgba(198,150,87,.18); color:var(--accent-gold); border-color:transparent; font-weight:700; }
  .group-row .g-tag.done{ background:rgba(79,157,110,.16); color:var(--color-correct); border-color:transparent; }
  .group-row .g-chevron{ flex-shrink:0; opacity:.45; }
  .group-row .g-chevron svg{ width:15px; height:15px; stroke:var(--ink-soft); }

  .group-row.accent-indigo{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-indigo) 12%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-indigo) 25%, var(--card-border)); }
  .group-row.accent-sakura{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-sakura-deep) 12%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-sakura-deep) 25%, var(--card-border)); }
  .group-row.accent-gold{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-gold) 12%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-gold) 25%, var(--card-border)); }

  /* ============ BACK ROW & EXPORT BUTTONS ============ */
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .back-btn{ width:32px; height:32px; border-radius:10px; background:var(--card-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft); cursor:pointer; flex-shrink:0; }
  .back-btn svg{ width:14px; height:14px; stroke:var(--ink-soft); }
  .crumb{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .crumb .eyebrow{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; letter-spacing:.12em; font-weight:600; color:var(--ink-faint); text-transform:uppercase; }
  .crumb .crumb-title{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .export-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .export-btn{
    width:32px; height:32px; border-radius:10px;
    background:var(--card-bg); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-indigo); cursor:pointer; box-shadow:var(--shadow-soft);
    transition:var(--transition), transform .15s var(--ease); padding:0;
  }
  .export-btn:active{ transform:scale(0.92); }
  .export-btn svg{ width:15px; height:15px; stroke:currentColor; }
  .export-btn.kanji-only{ color:var(--accent-sakura-deep); }

  /* ============ COMPACT FLASHCARD ============ */
  .meta-bar{ padding:8px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; border-radius:14px; }
  .meta-bar .meta-left{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .meta-bar .meta-cat{ font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:11.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta-bar .meta-page{ font-family:'Poppins',sans-serif; font-size:10px; font-weight:600; color:var(--accent-gold); }
  .meta-bar .meta-right{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:72px; }
  .meta-bar .meta-count{ font-family:'Poppins',sans-serif; font-size:10px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }

  .flashcard{
    position:relative; width:100%; height:205px; cursor:pointer; margin-bottom:12px;
    perspective:1200px; -webkit-perspective:1200px;
  }
  .exclude-btn{
    position:absolute; top:-8px; right:-6px; z-index:10;
    width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--card-bg); border:1px solid var(--card-border);
    box-shadow:var(--shadow-soft); cursor:pointer;
    transition:var(--transition), transform .2s var(--ease);
  }
  .exclude-btn svg{ width:13px; height:13px; stroke:var(--ink-soft); }
  .exclude-btn:active{ transform:scale(.9); }
  .exclude-btn.is-excluded{ background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); border-color:transparent; }
  .exclude-btn.is-excluded svg{ stroke:#fff; }

  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transition: transform .6s var(--ease);
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{
    transform: rotateY(180deg);
    -webkit-transform: rotateY(180deg);
  }

  .face{
    position:absolute; inset:0; width:100%; height:100%;
    border-radius:var(--radius-lg); padding:12px 14px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:var(--card-bg); border:1px solid var(--card-border);
    box-shadow:var(--shadow-card); transition:var(--transition);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0);
  }
  .face.front{
    transform: rotateY(0deg); -webkit-transform: rotateY(0deg);
    z-index:2;
  }
  .face.back{
    transform: rotateY(180deg); -webkit-transform: rotateY(180deg);
    z-index:1;
  }

  .face-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .face-top-left{ display:flex; align-items:center; gap:5px; min-width:0; }
  .badge{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; font-weight:600; padding:3px 8px; border-radius:999px; background: rgba(198,150,87,.14); color:var(--accent-gold); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge.blue{ background:rgba(61,90,120,.12); color:var(--accent-indigo); }
  .badge.sakura{ background:rgba(209,99,126,.14); color:var(--accent-sakura-deep); }

  .learned-badge{ width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--accent-gold), var(--accent-sakura-deep)); opacity:0; transform:scale(.4); transition: opacity .35s var(--ease), transform .35s var(--ease); flex-shrink:0; }
  .learned-badge svg{ width:9px; height:9px; stroke:#fff; }
  .flashcard.is-learned .learned-badge{ opacity:1; transform:scale(1); }

  /* KANJI LIGHT 300 TYPOGRAPHY */
  .font-kanji{ font-family:'Noto Sans JP',sans-serif; font-weight:300; font-synthesis:none; }

  .face-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; padding:2px 0; min-height:0; }
  .kanji-display{ font-family:'Noto Sans JP',sans-serif; font-size:32px; font-weight:300; color:var(--ink); line-height:1.25; letter-spacing:0.03em; }

  /* ============ KARTU DIBALIK (HERO PROMINENT VIEW) ============ */
  .kanji-back-hero{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; width:100%; padding:2px 0;
  }
  .kanji-back-ruby{
    font-size:34px; font-weight:300; color:var(--ink); line-height:1.3;
    display:inline-block;
  }
  .kanji-back-ruby rt{
    font-size:0.44em; font-weight:600; color:var(--accent-indigo);
    line-height:1; letter-spacing:0.04em;
  }
  .kanji-back-romaji{
    font-family:'Poppins',sans-serif; font-size:12px; font-style:italic;
    color:var(--ink-faint); margin-top:2px;
  }
  .kanji-back-arti{
    font-family:'Poppins',sans-serif; font-size:18px; font-weight:700;
    color:var(--accent-sakura-deep); margin-top:7px; line-height:1.25;
  }
  .kanji-back-divider{
    width:36px; height:1.5px; background:var(--card-border); margin:6px auto;
  }

  .face-bottom{ display:flex; align-items:center; justify-content:center; gap:5px; flex-shrink:0; }
  .flip-hint{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; color:var(--ink-faint); display:flex; align-items:center; gap:4px; }
  .flip-hint svg{ width:10px; height:10px; stroke:var(--ink-faint); }

  .arti-label{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-sakura-deep); }
  .arti-text{ font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:var(--ink); line-height:1.3; padding:0 2px; text-align:center; }

  /* ============ NAV ROW ============ */
  .nav-row{ display:grid; grid-template-columns:1fr auto 1fr; gap:var(--gap); align-items:center; }
  .shuffle-btn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--card-bg); border:1.5px dashed var(--card-border); box-shadow:var(--shadow-soft); cursor:pointer; flex-shrink:0; transition:var(--transition), transform .25s var(--ease); }
  .shuffle-btn svg{ width:16px; height:16px; stroke:var(--ink-soft); }
  .shuffle-btn.is-active{ background: linear-gradient(155deg, var(--accent-indigo), var(--accent-sakura-deep)); border-style:solid; border-color:transparent; }
  .shuffle-btn.is-active svg{ stroke:#fff; }
  .nav-btn{ display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 12px; border-radius:12px; font-family:'Noto Sans JP',sans-serif; font-weight:600; font-size:12px; color:var(--ink-soft); cursor:pointer; border:1px solid var(--card-border); background:var(--card-bg); }
  .nav-btn svg{ width:13px; height:13px; stroke:var(--ink-soft); }
  .nav-btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .nav-btn.primary{ background: linear-gradient(135deg, var(--accent-indigo), var(--accent-sakura-deep)); color:#fff; border-color:transparent; }
  .nav-btn.primary svg{ stroke:#fff; }
  .deck-count{ text-align:center; margin-top:8px; font-family:'Poppins',sans-serif; font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); }

  /* ============ TOGGLE CONTROLS ============ */
  .deck-controls{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .control-toggle-card{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:12px; box-shadow:var(--shadow-soft); transition:var(--transition);
  }
  .control-label{ display:flex; align-items:center; gap:8px; min-width:0; }
  .control-icon{
    width:26px; height:26px; border-radius:8px; background:var(--card-bg-soft);
    border:1px solid var(--card-border); display:flex; align-items:center;
    justify-content:center; flex-shrink:0;
  }
  .control-icon svg{ width:13px; height:13px; stroke:var(--accent-indigo); }
  .control-icon.sakura svg{ stroke:var(--accent-sakura-deep); }
  .control-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .control-title{ font-family:'Noto Sans JP',sans-serif; font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.2; }
  .control-sub{ font-family:'Noto Sans JP',sans-serif; font-size:9.5px; color:var(--ink-soft); line-height:1.15; }

  .switch-btn{
    position:relative; width:42px; height:22px; border-radius:999px;
    background:var(--card-border); border:1px solid var(--card-border);
    cursor:pointer; padding:2px; transition:background .3s var(--ease), border-color .3s var(--ease);
    flex-shrink:0;
  }
  .switch-btn .switch-knob{
    display:block; width:16px; height:16px; border-radius:50%;
    background:#ffffff; box-shadow:0 1.5px 4px rgba(0,0,0,0.25);
    transform:translateX(0); transition:transform .3s var(--ease);
  }
  .switch-btn.is-active{
    background:linear-gradient(135deg, var(--accent-indigo), var(--accent-sakura-deep));
    border-color:transparent;
  }
  .switch-btn.is-active .switch-knob{
    transform:translateX(20px);
  }

  /* ============ QUIZ, MATCH & ESSAY TYPE ============ */
  .mode-card{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); padding:14px 12px; box-shadow:var(--shadow-soft); cursor:pointer; margin-bottom:10px; }
  .mode-card .m-icon{ width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background: linear-gradient(155deg, var(--accent-indigo), var(--accent-gold)); }
  .mode-card .m-icon svg{ width:19px; height:19px; stroke:#fff; }
  .mode-card.mode-match .m-icon{ background: linear-gradient(155deg, var(--accent-sakura-deep), var(--accent-indigo)); }
  .mode-card.mode-type .m-icon{ background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); }
  .mode-card .m-body{ flex:1; min-width:0; }
  .mode-card .m-title{ font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:2px; }
  .mode-card .m-desc{ font-family:'Noto Sans JP',sans-serif; font-size:11px; color:var(--ink-soft); line-height:1.4; }

  .score-chip{ font-family:'Poppins',sans-serif; font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .score-chip.correct{ background: color-mix(in srgb, var(--color-correct) 18%, var(--card-bg)); color:var(--color-correct); }
  .score-chip.wrong{ background: color-mix(in srgb, var(--color-wrong) 18%, var(--card-bg)); color:var(--color-wrong); }
  .quiz-question{ padding:18px 14px; text-align:center; margin-bottom:12px; }
  .quiz-option{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; padding:12px 14px; border-radius:var(--radius-md); background:var(--card-bg); border:1.5px solid var(--card-border); font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:8px; cursor:pointer; }
  .quiz-option.is-correct{ border-color:var(--color-correct); background: color-mix(in srgb, var(--color-correct) 14%, var(--card-bg)); }
  .quiz-option.is-wrong{ border-color:var(--color-wrong); background: color-mix(in srgb, var(--color-wrong) 14%, var(--card-bg)); }
  .quiz-option.is-disabled{ pointer-events:none; opacity:.8; }

  .match-columns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .match-col{ display:flex; flex-direction:column; gap:6px; }
  .match-tile{ padding:8px; border-radius:10px; background:var(--card-bg); border:1.5px solid var(--card-border); font-family:'Noto Sans JP',sans-serif; font-size:13px; font-weight:600; color:var(--ink); text-align:center; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center; }
  .match-tile.is-selected{ border-color:var(--accent-indigo); background: color-mix(in srgb, var(--accent-indigo) 16%, var(--card-bg)); }
  .match-tile.is-correct{ border-color:var(--color-correct); background: color-mix(in srgb, var(--color-correct) 16%, var(--card-bg)); opacity:.55; pointer-events:none; }
  .match-tile.is-wrong{ border-color:var(--color-wrong); background: color-mix(in srgb, var(--color-wrong) 18%, var(--card-bg)); }

  /* ============ SPEEDRUN & TIMER STYLING ============ */
  .speedrun-control-card{
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:var(--radius-lg); padding:12px 14px; margin-bottom:12px;
    box-shadow:var(--shadow-soft); display:flex; flex-direction:column; gap:10px;
  }
  .speedrun-header{ display:flex; align-items:center; justify-content:space-between; }
  .speedrun-title-box{ display:flex; align-items:center; gap:8px; }
  .speedrun-title{ font-size:12px; font-weight:700; color:var(--ink); }
  .speedrun-desc{ font-size:10px; color:var(--ink-soft); }
  
  .stepper-box{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card-bg-soft); border:1px solid var(--card-border);
    border-radius:10px; padding:6px 10px;
  }
  .stepper-label{ font-size:11px; font-weight:600; color:var(--ink-soft); }
  .stepper-actions{ display:flex; align-items:center; gap:8px; }
  .step-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--card-border);
    background:var(--card-bg); font-weight:700; font-size:14px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-soft); transition:all .15s ease;
  }
  .step-btn:active{ transform:scale(0.92); }
  .step-value{ font-family:'Poppins',sans-serif; font-size:13px; font-weight:700; min-width:38px; text-align:center; color:var(--accent-indigo); }

  .speedrun-timer-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'Poppins',sans-serif; font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:999px; background:rgba(209,99,126,0.15);
    color:var(--accent-sakura-deep); border:1px solid rgba(209,99,126,0.3);
  }
  .speedrun-timer-pill.urgent{
    background:#c65c56; color:#fff; border-color:transparent;
    animation:pulseUrgent .6s infinite alternate;
  }
  @keyframes pulseUrgent{ from{ transform:scale(1); } to{ transform:scale(1.06); } }

  .stopwatch-badge{
    display:inline-flex; align-items:center; gap:4px; font-family:'Poppins',sans-serif;
    font-size:10.5px; font-weight:600; color:var(--ink-soft);
  }

  /* ============ TYPE FILTER & SELECTION ============ */
  .kanji-select-bar{ display:flex; justify-content:space-between; align-items:center; margin:10px 0 8px; }
  .kanji-select-meta{ font-family:'Poppins',sans-serif; font-size:11px; font-weight:600; color:var(--ink-soft); }
  .kanji-select-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;
    max-height:42vh; overflow-y:auto; padding:4px 2px 8px;
    -webkit-overflow-scrolling:touch;
  }
  .kanji-check-tile{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--card-bg); border:1.5px solid var(--card-border); border-radius:12px;
    padding:14px 4px; cursor:pointer; transition:all .2s var(--ease); user-select:none;
    font-family:'Noto Sans JP', sans-serif; font-weight:300; font-size:18px; color:var(--ink);
    box-shadow:var(--shadow-soft); text-align:center; line-height:1.25;
  }
  .kanji-check-tile:active{ transform:scale(0.95); }
  .kanji-check-tile.is-checked{
    border-color:var(--accent-indigo);
    background:color-mix(in srgb, var(--accent-indigo) 14%, var(--card-bg));
  }
  .kanji-check-indicator{
    position:absolute; top:4px; right:4px; width:13px; height:13px; border-radius:4px;
    border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center;
    background:var(--card-bg-soft); transition:all .2s ease;
  }
  .kanji-check-tile.is-checked .kanji-check-indicator{
    background:linear-gradient(135deg, var(--accent-indigo), var(--accent-sakura-deep));
    border-color:transparent;
  }
  .kanji-check-indicator svg{ width:8px; height:8px; stroke:#fff; stroke-width:3; display:none; }
  .kanji-check-tile.is-checked .kanji-check-indicator svg{ display:block; }

  /* ============ HISTORY PRESET LIST ============ */
  .history-box{ margin-top:16px; border-top:1px dashed var(--card-border); padding-top:12px; }
  .history-box-title{ font-family:'Noto Sans JP',sans-serif; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
  .history-item{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:8px 10px; margin-bottom:6px; cursor:pointer;
    box-shadow:var(--shadow-soft); transition:border-color .2s var(--ease);
  }
  .history-item:hover{ border-color:var(--accent-indigo); }
  .history-left{ display:flex; flex-direction:column; gap:1px; }
  .history-count{ font-family:'Poppins',sans-serif; font-size:11.5px; font-weight:700; color:var(--ink); }
  .history-time{ font-family:'Poppins',sans-serif; font-size:9.5px; color:var(--ink-faint); }
  .history-badge{ font-family:'Poppins',sans-serif; font-size:9.5px; font-weight:600; padding:2px 7px; border-radius:6px; background:var(--card-bg-soft); color:var(--accent-indigo); border:1px solid var(--card-border); }

  /* ============ TYPE MODE STYLING ============ */
  .type-form{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .type-input{
    width:100%; padding:13px 14px; border-radius:var(--radius-md);
    background:var(--card-bg); border:1.5px solid var(--card-border);
    font-family:'Zen Kaku Gothic New','Poppins',sans-serif; font-size:16px; font-weight:700;
    color:var(--ink); box-shadow:var(--shadow-soft); transition:border-color .3s var(--ease), box-shadow .3s var(--ease);
    outline:none; text-align:center;
  }
  .type-input:focus{ border-color:var(--accent-indigo); box-shadow:0 0 0 3px rgba(61,90,120,0.2); }
  .type-input[disabled]{ opacity:0.85; background:var(--card-bg-soft); }
  .type-feedback{
    padding:12px 14px; border-radius:var(--radius-md); display:flex; flex-direction:column; gap:6px;
    margin-top:6px; animation:screenIn .25s var(--ease); text-align:left;
  }
  .type-feedback.correct{
    background:color-mix(in srgb, var(--color-correct) 15%, var(--card-bg));
    border:1.5px solid var(--color-correct);
  }
  .type-feedback.wrong{
    background:color-mix(in srgb, var(--color-wrong) 15%, var(--card-bg));
    border:1.5px solid var(--color-wrong);
  }
  .feedback-header{ display:flex; align-items:center; justify-content:space-between; }
  .feedback-title{ font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .type-feedback.correct .feedback-title{ color:var(--color-correct); }
  .type-feedback.wrong .feedback-title{ color:var(--color-wrong); }
  .feedback-answer{ font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  .feedback-romaji{ font-size:11px; color:var(--accent-indigo); font-style:italic; }

  .result-card{ padding:26px 18px; text-align:center; }
  .result-card .r-icon{ width:50px; height:50px; border-radius:16px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); }
  .result-card .r-icon svg{ width:24px; height:24px; stroke:#fff; }
  .result-card .r-score{ font-family:'Poppins',sans-serif; font-weight:800; font-size:34px; color:var(--ink); line-height:1; }

  .reset-link{ display:block; margin:14px auto 0; padding:6px 12px; background:none; border:none; cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-size:10.5px; font-weight:500; color:var(--ink-faint); text-decoration:underline; }
</style>

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const countElement = document.getElementById("user-count");
    const connectedRef = ref(db, ".info/connected");
    const onlineUsersRef = ref(db, "online_users");

    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        const myUserRef = push(onlineUsersRef);
        set(myUserRef, { joinedAt: Date.now() });
        onDisconnect(myUserRef).remove();
      }
    });

    onValue(onlineUsersRef, (snap) => {
      const totalOnline = snap.exists() ? Object.keys(snap.val()).length : 1;
      if (countElement) {
        countElement.textContent = `${totalOnline} sedang belajar`;
      }
    });
  } catch (err) {
    const countElement = document.getElementById("user-count");
    if (countElement) countElement.textContent = "1 sedang belajar";

/* TTS Initialization */
function speakKana(htmlStr){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const temp = document.createElement('div');
    temp.innerHTML = htmlStr;
    const rts = temp.querySelectorAll('rt');
    rts.forEach(r => r.remove());

    const ut = new SpeechSynthesisUtterance(cleanText);
    ut.lang = 'ja-JP';
    ut.rate = 0.85;
    window.speechSynthesis.speak(ut);
  }
}

/* ============================================================
   QUIZ BUILDERS & LOGIC
   ============================================================ */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatSec(s){
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${m < 10 ? '0' : ''}${m}:${rem < 10 ? '0' : ''}${rem}`;
}

function collectPool(chapterIds){
  let pool = [];
  chapterIds.forEach(cid => {
    const chap = CHAPTERS.find(c => c.id === cid);
    if (!chap) return;
    chap.groups.forEach(g => {
      g.cards.forEach((card) => {
        card.words.forEach((w, wIdx) => {
          pool.push({
            card: { 
              type: 'kanji_item', 
              kanji: w.kanjiText || card.kanji, 
              kana: w.kana, 
              arti: w.id, 
              romaji: w.romaji, 
              parentKanji: card.kanji 
            },
            groupId: g.id,
            chapterId: cid,
            uniqueId: `${g.id}_${card.kanji}_${wIdx}`
          });
        });
      });
    });
  });
  return pool;
}

function collectPoolGroup(groupId){
  let pool = [];
  CHAPTERS.forEach(c => {
    const g = c.groups.find(gr => gr.id === groupId);
    if(!g) return;
    g.cards.forEach((card) => {
      card.words.forEach((w, wIdx) => {
        pool.push({
          card: { 
            type: 'kanji_item', 
            kanji: w.kanjiText || card.kanji, 
            kana: w.kana, 
            arti: w.id, 
            romaji: w.romaji, 
            parentKanji: card.kanji 
          },
          groupId: g.id,
          chapterId: c.id,
          uniqueId: `${g.id}_${card.kanji}_${wIdx}`
        });
      });
    });
  });
  return pool;
}

function pickDistractors(pool, target, count){
  const same = pool.filter(p => p.uniqueId !== target.uniqueId && p.card.kana !== target.card.kana);
  let cand = shuffleArray(same).slice(0, count);
  return cand;
}

/* MC Quiz Builder */
function buildMCQuestions(scopeKey){
  const pool = SCOPES[scopeKey].build();
  let qs = [];

  pool.forEach(item => {
    const distractors = pickDistractors(pool, item, 3);
    const options = shuffleArray([item, ...distractors]).map(o => {
      return { 
        text: o.card.kana, 
        sub: null, 
        correct: o.uniqueId === item.uniqueId 
      };
    });
    qs.push({
      item, options,
      promptMain: item.card.kanji,
      promptSub: 'Pilih cara baca (Hiragana) yang tepat'
    });
  });
  return shuffleArray(qs);
}

/* Matching Quiz Builder */
function buildMatchingRounds(scopeKey, roundSize){
  const pool = shuffleArray(SCOPES[scopeKey].build());
  const rounds = [];
  for(let i=0; i<pool.length; i+=roundSize) rounds.push(pool.slice(i, i+roundSize));
  return rounds;
}

/* Normalizer Jawaban Ketik Manual */
function extractAcceptedAnswers(card){
  const accepted = new Set();
  function addVariants(str){
    if(!str) return;
    const s = str.trim().toLowerCase();
    accepted.add(s);
    const noBrackets = s.replace(/\[.*?\]/g, '').replace(/［.*?］/g, '').replace(/（.*?）/g, '').replace(/\(.*?\)/g, '').trim();
    if(noBrackets) accepted.add(noBrackets);
    const insideBrackets = s.replace(/[\[\]\(\)（）［］]/g, '').trim();
    if(insideBrackets) accepted.add(insideBrackets);
    s.split(/[\/／,、]/).forEach(part => {
      const p = part.trim();
      if(p){
        accepted.add(p);
        accepted.add(p.replace(/[\[\]\(\)（）［］]/g, '').trim());
      }
    });
  }

  if(card.kana) addVariants(card.kana);
  if(card.romaji) addVariants(card.romaji);

  const cleanList = [];
  accepted.forEach(val => {
    if(!val) return;
    const norm = val.toLowerCase().replace(/[\s\.\,\!\?～~・\-—\[\]\(\)（）［］]/g, '');
    if(norm) cleanList.push(norm);
  });
  return Array.from(new Set(cleanList));
}

function checkTypeAnswer(userInput, card){
  if(!userInput || !userInput.trim()) return false;
  const cleanUser = userInput.toLowerCase().replace(/[\s\.\,\!\?～~・\-—\[\]\(\)（）［］]/g, '');
  const accepted = extractAcceptedAnswers(card);
  return accepted.includes(cleanUser);
}

function playCurrentCardTTS(){
  if(!state.autoTTS) return;
  const chap = CHAPTERS.find(c => c.id === state.chapterId);
  if (!chap) return;
  const g = chap.groups.find(gr => gr.id === state.groupId);
  if (!g || !state.order) return;
  const card = g.cards[state.order[state.cardIndex]];
  if (card && card.words) {
    speakKana(card.words.map(w => w.jp).join('、'));
  }
}

function stopAllQuizTimers(){
  if(state.questionTimer){ clearInterval(state.questionTimer); state.questionTimer = null; }
  if(state.totalTimer){ clearInterval(state.totalTimer); state.totalTimer = null; }
}

function startTotalTimer(){
  state.totalElapsedSec = 0;
  if(state.totalTimer) clearInterval(state.totalTimer);
  state.totalTimer = setInterval(() => {
    state.totalElapsedSec++;
    const el = document.getElementById('quizTotalTimer');
    if(el) el.textContent = formatSec(state.totalElapsedSec);
  }, 1000);
}

function resetQuestionTimer(){
  if(state.questionTimer) clearInterval(state.questionTimer);
  if(!state.quiz || !state.quiz.isSpeedrun) return;
  state.questionTimeLeft = state.quiz.speedrunSec;
  updateQuestionTimerDisplay();
  state.questionTimer = setInterval(() => {
    state.questionTimeLeft--;
    updateQuestionTimerDisplay();
    if(state.questionTimeLeft <= 0){
      clearInterval(state.questionTimer);
      state.questionTimer = null;
      handleTypeTimeOut();
    }
  }, 1000);
}

function updateQuestionTimerDisplay(){
  const el = document.getElementById('speedrunCountdown');
  if(!el) return;
  el.textContent = `${state.questionTimeLeft}s`;
  if(state.questionTimeLeft <= 3){
    el.classList.add('urgent');
  } else {
    el.classList.remove('urgent');
  }
}

function handleTypeTimeOut(){
  const q = state.quiz;
  if(!q || q.mode !== 'type' || q.answered) return;
  const input = document.getElementById('typeAnswerInput');
  const val = input ? input.value.trim() : '';
  q.userInput = val || '(Waktu Habis)';
  const question = q.questions[q.index];
  const isRight = checkTypeAnswer(val, question.item.card);
  q.isCorrect = isRight;
  if(isRight){
    q.correct++;
    speakKana(question.item.card.kana);
  } else {
    q.wrong++;
  }
  q.answered = true;
  renderQuizType();
}

function saveTypeHistoryEntry(q){
  let hist = safeGet(STORE.typeHistory, []);
  const entry = {
    id: Date.now(),
    scopeKey: q.scopeKey,
    count: q.isInfinite ? 'Infinity' : q.questions.length,
    uids: Array.from(state.selectedTypeUids),
    durationSec: state.totalElapsedSec,
    speedrun: q.isSpeedrun,
    speedrunSec: q.speedrunSec,
    infinite: q.isInfinite,
    dateStr: new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'short' }) + ' ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })
  };
  hist.unshift(entry);
  if(hist.length > 8) hist = hist.slice(0, 8);
  safeSet(STORE.typeHistory, hist);
}

  const q = state.quiz;

  q.selected = null;

/* ============================================================
   EXPORT TXT FILE GENERATOR (GABUNGAN UTUH PER KELOMPOK)
   ============================================================ */
function exportChapterTxt(chapterId, mode){
  const chap = CHAPTERS.find(c => c.id === chapterId);
  if(!chap) return;

  let totalKanjiCount = totalCardsInChapter(chap);
  let lines = [];
  lines.push(`=== ${chap.title} ===`);
  lines.push(`Total Seluruh Kotoba: ${totalKanjiCount} Butir\n`);

  chap.groups.forEach(g => {
    lines.push(`--- ${g.title} (${g.page}) ---`);
    g.cards.forEach(card => {
      card.words.forEach(w => {
        if(mode === 'with_arti'){
          lines.push(`${w.kanjiText || card.kanji}\t${w.kana}\t${w.id}`);
        } else {
          lines.push(`${w.kanjiText || card.kanji}`);
        }
      });
    });
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${chap.id}_${mode === 'with_arti' ? 'Lengkap_Kanji_Arti' : 'Lengkap_Kanji_Saja'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderChapter(cid){
  const chap = CHAPTERS.find(c => c.id === cid);
  if (!chap) { goHome(); return; }

  let rows = '';
  chap.groups.forEach(g => {
    const l = learnedCountInGroup(g);
    const t = totalCardsInGroup(g);
    const done = l === t && t > 0;
    rows += `
      <button class="group-row ${g.accent}" data-open-deck="${g.id}">
        <span class="g-icon ${g.accent}"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon(g.icon)}</svg></span>

          <span class="g-tags">

function renderDeck(cid, gid){
  const chap = CHAPTERS.find(c => c.id === cid);
  if (!chap) { goHome(); return; }
  const g = chap.groups.find(gr => gr.id === gid);
  if (!g) { goChapter(cid); return; }

  if(!state.order || state.order.length === 0) state.order = g.cards.map((_,i)=>i);
  if (state.cardIndex >= state.order.length) state.cardIndex = 0;

  const idx = state.cardIndex;
  const actualIdx = state.order[idx];
  const card = g.cards[actualIdx];
  if (!card) { state.cardIndex = 0; render(); return; }

  const uid = cardUid(g.id, actualIdx);
  const isLearned = learnedSet.has(uid);
  const isExcluded = excludedSet.has(uid);
  const learnedCount = learnedCountInGroup(g);

  const faces = renderCardFace(card, g.kategori, g.page);

function renderQuizPlay(){
  if(state.quiz.mode === 'mc') renderQuizMC();
  else if(state.quiz.mode === 'match') renderQuizMatch();
  else if(state.quiz.mode === 'type') renderQuizType();
}

  const q = state.quiz;
  return `
    <div class="back-row">
      <button class="back-btn" id="exitQuiz"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('close')}</svg></button>

          <span id="quizTotalTimer">${formatSec(state.totalElapsedSec)}</span>
        </span>
        <span class="score-chip correct">${q.correct !== undefined ? q.correct : q.roundsCleared}</span>

}

function renderQuizType(){
  const q = state.quiz;
  if(!q.isInfinite && q.index >= q.questions.length){ renderQuizResult(); return; }
  
  if(q.isInfinite && q.index >= q.questions.length){
    q.questions = shuffleArray(q.questions);
    q.index = 0;
  }

  const question = q.questions[q.index];
  const s = SCOPES[q.scopeKey];

  let feedbackHtml = '';
  if(q.answered){
    const card = question.item.card;
    const correctMain = card.kana;
    const correctSub = card.romaji ? card.romaji : '';

    feedbackHtml = `
      <div class="type-feedback ${q.isCorrect ? 'correct' : 'wrong'}">
        <div class="feedback-header">
          <span class="feedback-title">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;stroke:currentColor;">
              ${icon(q.isCorrect ? 'check' : 'close')}
            </svg>
            ${q.isCorrect ? 'Tepat Sekali!' : 'Kurang Tepat'}
          </span>
          <button class="sound-btn" type="button" aria-label="Audio" style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border);cursor:pointer;"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;stroke:var(--ink-soft);">${icon('speaker')}</svg></button>
        </div>
        <div>
          <div class="feedback-answer">${correctMain}</div>
          ${correctSub ? `<div class="feedback-romaji">${correctSub}</div>` : ''}
        </div>
      </div>
    `;
  }

  screenEl.innerHTML = `
    <div class="screen-inner">
      ${quizHeaderHtml(s.label, q.isInfinite ? 'Infinity Mode (∞)' : (q.isSpeedrun ? `Speedrun (${q.speedrunSec}s)` : 'Ketik Manual'))}
      
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;color:var(--ink-faint);margin-bottom:4px;">
          <span>${q.isInfinite ? 'SOAL KE-' + (q.index + 1) + ' (TAK TERBATAS)' : 'SOAL ' + (q.index+1) + ' DARI ' + q.questions.length}</span>
          ${q.isSpeedrun && !q.answered ? `
            <span class="speedrun-timer-pill" id="speedrunCountdown">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" style="width:10px;height:10px;stroke:currentColor;">${icon('zap')}</svg>
              ${state.questionTimeLeft}s
            </span>
          ` : ''}
        </div>
        ${!q.isInfinite ? `<div class="progress-bar"><span style="width:${(q.index/q.questions.length)*100}%"></span></div>` : `<div class="progress-bar"><span style="width:100%;background:linear-gradient(90deg,var(--accent-gold),var(--accent-indigo));"></span></div>`}
      </div>
      
      <div class="bento quiz-question">
        <span style="font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:6px;">${question.promptSub}</span>
        <div style="font-size:28px;line-height:1.25;"><span class="font-kanji" lang="ja">${question.promptMain}</span></div>
      </div>

      <form class="type-form" id="typeQuizForm" onsubmit="return false;">
        <input type="text" class="type-input" id="typeAnswerInput" 
               placeholder="Ketik hiragana / romaji..." 
               value="${q.userInput || ''}" 
               ${q.answered ? 'disabled' : ''} 
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        
        ${feedbackHtml}

        <div style="display:flex;gap:8px;margin-top:6px;">
          ${!q.answered ? `
            <button type="button" class="nav-btn" id="skipTypeQuestion" style="flex:1;">Lewati</button>
            <button type="submit" class="nav-btn primary" id="submitTypeAnswer" style="flex:2;">Periksa (Enter)</button>
          ` : `
            <button type="button" class="nav-btn primary" id="nextTypeQuestion" style="width:100%;">Lanjut (Enter)<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('chevRight')}</svg></button>
          `}
        </div>
      </form>
    </div>`;

  setTimeout(() => {
    if(!q.answered){
      const input = document.getElementById('typeAnswerInput');
      if(input) input.focus();
    } else {
      const nextBtn = document.getElementById('nextTypeQuestion');
      if(nextBtn) nextBtn.focus();
    }
  }, 50);

function renderQuizMC(){
  const q = state.quiz;
  if(q.index >= q.questions.length){ renderQuizResult(); return; }
  const question = q.questions[q.index];
  const s = SCOPES[q.scopeKey];

  const optsHtml = question.options.map((opt, i) => `
    <button class="quiz-option" data-mc-option="${i}">
      <span><span>${opt.text}</span></span>
      <span class="opt-check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${icon('check')}</svg></span>
    </button>`).join('');

  screenEl.innerHTML = `
    <div class="screen-inner">
      ${quizHeaderHtml(s.label, 'Pilihan Ganda')}
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--ink-faint);margin-bottom:4px;">
          <span>SOAL ${q.index+1} DARI ${q.questions.length}</span>
        </div>
        <div class="progress-bar"><span style="width:${(q.index/q.questions.length)*100}%"></span></div>
      </div>
      <div class="bento quiz-question">
        <span style="font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:6px;">${question.promptSub}</span>
        <div style="font-size:26px;line-height:1.25;"><span class="font-kanji" lang="ja">${question.promptMain}</span></div>
      </div>
      <div id="quizOptions">${optsHtml}</div>
    </div>`;
}

function renderQuizMatch(){
  const q = state.quiz;
  const round = q.rounds[q.roundIndex];
  const s = SCOPES[q.scopeKey];

  function tileClass(side, i){
    if(q.matched.has(i)) return 'is-correct';
    if(q.selected && q.selected.side===side && q.selected.idx===i) return 'is-selected';
    if(q.wrongFlash && ((q.wrongFlash.a.side===side && q.wrongFlash.a.idx===i) || (q.wrongFlash.b.side===side && q.wrongFlash.b.idx===i))) return 'is-wrong';
    return '';
  }

  const leftHtml = q.leftOrder.map(i => {
    const item = round[i];
    return `<button class="match-tile ${tileClass('left',i)}" data-match-side="left" data-match-idx="${i}" ${q.matched.has(i)?'disabled':''}><span class="font-kanji" lang="ja" style="font-size:15px;">${item.card.kanji}</span></button>`;
  }).join('');

  const rightHtml = q.rightOrder.map(i => {
    const item = round[i];
    return `<button class="match-tile ${tileClass('right',i)}" data-match-side="right" data-match-idx="${i}" ${q.matched.has(i)?'disabled':''}>${item.card.kana} <span style="font-size:10px;opacity:.7;margin-left:4px;">(${item.card.arti})</span></button>`;
  }).join('');

  screenEl.innerHTML = `
    <div class="screen-inner">
      ${quizHeaderHtml(s.label, 'Pasangan Jawaban')}
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--ink-faint);margin-bottom:4px;">
          <span>RONDE ${q.roundIndex+1} DARI ${q.rounds.length}</span>
        </div>
        <div class="progress-bar"><span style="width:${(q.roundIndex/q.rounds.length)*100}%"></span></div>
      </div>
      <div class="match-columns">
        <div class="match-col">${leftHtml}</div>
        <div class="match-col">${rightHtml}</div>
      </div>
    </div>`;
}

function renderQuizResult(){
  const q = state.quiz;
  q.finished = true;
  stopAllQuizTimers();

  if(q.mode === 'type'){
    saveTypeHistoryEntry(q);
  }

  let scoreBig, scoreLabel;
  if(q.mode === 'match'){
    scoreBig = q.rounds.length;
    scoreLabel = `${q.rounds.length} Ronde Selesai (${q.mistakes} kesalahan)`;
  } else if(q.isInfinite){
    scoreBig = q.correct + ' Benar';
    scoreLabel = `Sesi Infinity (Total ${q.correct + q.wrong} dikerjakan)`;
  } else {
    const pct = Math.round((q.correct/q.questions.length)*100);
    scoreBig = pct + '%';
    scoreLabel = `${q.correct} benar dari ${q.questions.length} soal`;
  }

  screenEl.innerHTML = `
    <div class="screen-inner">
      <div class="bento result-card">
        <div class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('trophy')}</svg></div>
        <div class="r-score">${scoreBig}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">${scoreLabel}</div>
        <div style="font-size:11.5px;font-weight:700;color:var(--accent-indigo);margin-top:6px;">
          Total Waktu Pengerjaan: ${formatSec(state.totalElapsedSec)}
          ${q.isSpeedrun ? ` · Mode Speedrun (${q.speedrunSec}s)` : ''}
          ${q.isInfinite ? ` · Infinity Mode` : ''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        <button class="nav-btn primary" id="retryQuiz">Ulangi Latihan</button>
        <button class="nav-btn" id="backTestHubFromResult">Kembali ke Menu Latihan</button>
      </div>
    </div>`;
}

/* ============================================================
   EVENT DELEGATION & INITIALIZATION
   ============================================================ */
function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'chapter') renderChapter(state.chapterId);
  else if(state.screen === 'deck') renderDeck(state.chapterId, state.groupId);
  else if(state.screen === 'test-hub') renderTestHub();
  else if(state.screen === 'test-subhub') renderTestSubHub();
  else if(state.screen === 'quiz-mode') renderQuizMode();
  else if(state.screen === 'type-select') renderTypeSelect();
  else if(state.screen === 'quiz-play') renderQuizPlay();
}

function handleTypeSubmit(){
  const q = state.quiz;
  if(!q || q.mode !== 'type') return;
  if(!q.answered){
    if(state.questionTimer){ clearInterval(state.questionTimer); state.questionTimer = null; }
    const input = document.getElementById('typeAnswerInput');
    const val = input ? input.value : '';
    q.userInput = val;
    const question = q.questions[q.index];
    const isRight = checkTypeAnswer(val, question.item.card);
    q.isCorrect = isRight;
    if(isRight){
      q.correct++;
      speakKana(question.item.card.kana);
    } else {
      q.wrong++;
    }
    q.answered = true;
    renderQuizType();
  } else {
    q.index++;
    q.answered = false;
    q.userInput = '';
    renderQuizType();
    resetQuestionTimer();
  }
}

screenEl.addEventListener('click', (e)=>{
  const openChap = e.target.closest('[data-open-chapter]');
  if(openChap){ goChapter(openChap.getAttribute('data-open-chapter')); return; }

  const openDeck = e.target.closest('[data-open-deck]');
  if(openDeck){ goDeck(state.chapterId, openDeck.getAttribute('data-open-deck')); return; }

  const openSubHub = e.target.closest('[data-open-subhub]');
  if(openSubHub){ goTestSubHub(openSubHub.getAttribute('data-open-subhub')); return; }

  const openQuizMode = e.target.closest('[data-open-quiz-mode]');
  if(openQuizMode){ goQuizMode(openQuizMode.getAttribute('data-open-quiz-mode')); return; }

  const exportBtn = e.target.closest('[data-export-chap]');
  if(exportBtn){
    const cid = exportBtn.getAttribute('data-export-chap');
    const mode = exportBtn.getAttribute('data-export-mode');
    exportChapterTxt(cid, mode);
    return;
  }

  if(e.target.closest('#openTestHub')){ goTestHub(); return; }
  if(e.target.closest('#backTestHub')){ goTestHub(); return; }
  if(e.target.closest('#backSubHub')){
    if(state.pendingBigGroup) goTestSubHub(state.pendingBigGroup);
    else goTestHub();
    return;
  }
  if(e.target.closest('#backTestHubFromResult')){ goTestHub(); return; }
  if(e.target.closest('#backQuizMode')){ goQuizMode(state.pendingScope); return; }
  if(e.target.closest('#exitQuiz')){ exitQuiz(); return; }

  const startMc = e.target.closest('[data-start-mc]');
  if(startMc){ startMCQuiz(startMc.getAttribute('data-start-mc')); return; }

  const startMatch = e.target.closest('[data-start-match]');
  if(startMatch){ startMatchQuiz(startMatch.getAttribute('data-start-match')); return; }

  const startType = e.target.closest('[data-start-type]');
  if(startType){ openTypeSelect(startType.getAttribute('data-start-type')); return; }

  if(e.target.closest('#toggleSpeedrunSwitch')){
    state.isSpeedrun = !state.isSpeedrun;
    renderTypeSelect();
    return;
  }

  if(e.target.closest('#toggleInfiniteSwitch')){
    state.isInfinite = !state.isInfinite;
    safeSet(STORE.infiniteMode, state.isInfinite);
    renderTypeSelect();
    return;
  }

  if(e.target.closest('#speedrunDec')){
    state.speedrunSec = Math.max(3, state.speedrunSec - 1);
    safeSet(STORE.speedrunSeconds, state.speedrunSec);
    renderTypeSelect();
    return;
  }

  if(e.target.closest('#speedrunInc')){
    state.speedrunSec = Math.min(60, state.speedrunSec + 1);
    safeSet(STORE.speedrunSeconds, state.speedrunSec);
    renderTypeSelect();
    return;
  }

  /* Interaksi Pemilihan Soal Ketik Manual (In-Place DOM: Scroll Tetap Diam) */
  const tileKanji = e.target.closest('[data-toggle-kanji-uid]');
  if(tileKanji){
    const uid = tileKanji.getAttribute('data-toggle-kanji-uid');
    if(state.selectedTypeUids.has(uid)){
      state.selectedTypeUids.delete(uid);
      tileKanji.classList.remove('is-checked');
    } else {
      state.selectedTypeUids.add(uid);
      tileKanji.classList.add('is-checked');
    }
    updateTypeSelectUI();
    return;
  }

  if(e.target.closest('#toggleSelectAllKanji')){
    const isAll = state.selectedTypeUids.size === state.typeSelectionPool.length;
    if(isAll){
      state.selectedTypeUids.clear();
      screenEl.querySelectorAll('.kanji-check-tile').forEach(t => t.classList.remove('is-checked'));
    } else {
      state.selectedTypeUids = new Set(state.typeSelectionPool.map(item => item.uniqueId));
      screenEl.querySelectorAll('.kanji-check-tile').forEach(t => t.classList.add('is-checked'));
    }
    updateTypeSelectUI();
    return;
  }

  const histItem = e.target.closest('[data-load-history-id]');
  if(histItem){
    const hId = parseInt(histItem.getAttribute('data-load-history-id'), 10);
    const histList = safeGet(STORE.typeHistory, []);
    const found = histList.find(h => h.id === hId);
    if(found && Array.isArray(found.uids)){
      state.selectedTypeUids = new Set(found.uids.filter(uid => state.typeSelectionPool.some(item => item.uniqueId === uid)));
      if(found.speedrun !== undefined) state.isSpeedrun = found.speedrun;
      if(found.speedrunSec) state.speedrunSec = found.speedrunSec;
      if(found.infinite !== undefined) state.isInfinite = found.infinite;
      renderTypeSelect();
    }
    return;
  }

  if(e.target.closest('#startCustomTypeQuiz')){
    startCustomTypeQuiz();
    return;
  }

  if(e.target.closest('#retryQuiz')){
    if(state.quiz.mode === 'mc') startMCQuiz(state.quiz.scopeKey);
    else if(state.quiz.mode === 'match') startMatchQuiz(state.quiz.scopeKey);
    else if(state.quiz.mode === 'type') openTypeSelect(state.quiz.scopeKey);
    return;
  }

  if(e.target.closest('#submitTypeAnswer') || e.target.closest('#nextTypeQuestion')){
    handleTypeSubmit();
    return;
  }

  if(e.target.closest('#skipTypeQuestion')){
    const q = state.quiz;
    if(state.questionTimer){ clearInterval(state.questionTimer); state.questionTimer = null; }
    q.userInput = '(Dilewati)';
    q.isCorrect = false;
    q.wrong++;
    q.answered = true;
    renderQuizType();
    return;
  }

  const mcOpt = e.target.closest('[data-mc-option]');
  if(mcOpt){
    const q = state.quiz;
    if(q.answered) return;
    q.answered = true;
    const optIdx = parseInt(mcOpt.getAttribute('data-mc-option'), 10);
    const question = q.questions[q.index];
    const chosen = question.options[optIdx];
    screenEl.querySelectorAll('[data-mc-option]').forEach((btn, i) => {
      btn.classList.add('is-disabled');
      if(question.options[i].correct) btn.classList.add('is-correct');
      else if(i === optIdx) btn.classList.add('is-wrong');
    });
    if(chosen.correct) q.correct++; else q.wrong++;
    setTimeout(() => { q.index++; q.answered = false; renderQuizPlay(); }, 850);
    return;
  }

  const matchTile = e.target.closest('[data-match-side]');
  if(matchTile && !matchTile.disabled){
    const q = state.quiz;
    if(q.wrongFlash) return;
    const side = matchTile.getAttribute('data-match-side');
    const idx = parseInt(matchTile.getAttribute('data-match-idx'), 10);

    if(!q.selected || q.selected.side === side){ q.selected = {side, idx}; renderQuizMatch(); return; }

    const prev = q.selected;
    if(prev.idx === idx){
      q.matched.add(idx);
      q.selected = null;
      renderQuizMatch();
      if(q.matched.size === q.rounds[q.roundIndex].length){
        setTimeout(()=>{
          q.roundIndex++;
          q.roundsCleared = q.roundIndex;
          if(q.roundIndex >= q.rounds.length) renderQuizResult();
          else { setupMatchRound(); renderQuizPlay(); }
        }, 500);
      }
    } else {
      q.mistakes++;
      q.wrongFlash = { a: prev, b: {side, idx} };
      q.selected = null;
      renderQuizMatch();
      setTimeout(()=>{ q.wrongFlash = null; renderQuizMatch(); }, 500);
    }
    return;
  }

  if(e.target.closest('#backHome')){ goHome(); return; }
  if(e.target.closest('#backChapter')){ goChapter(state.chapterId); return; }

  const toggleRev = e.target.closest('#toggleReverse');
  if(toggleRev){
    state.reverseMode = !state.reverseMode;
    safeSet(STORE.reverseMode, state.reverseMode);
    renderDeck(state.chapterId, state.groupId);
    return;
  }

  const toggleAutoTTS = e.target.closest('#toggleAutoTTS');
  if(toggleAutoTTS){
    state.autoTTS = !state.autoTTS;
    safeSet(STORE.autoTTS, state.autoTTS);
    renderDeck(state.chapterId, state.groupId);
    if(state.autoTTS) playCurrentCardTTS();
    return;
  }

  if(e.target.closest('#shuffleDeck')){
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    if (chap) {
      const g = chap.groups.find(gr => gr.id === state.groupId);
      if (g) {
        let pool = g.cards.map((_,i)=>i).filter(i => !excludedSet.has(cardUid(g.id, i)));
        if(pool.length === 0) pool = g.cards.map((_,i)=>i);
        state.order = shuffleArray(pool);
        state.cardIndex = 0;
        state.shuffled = true;
        renderDeck(state.chapterId, state.groupId);
        playCurrentCardTTS();
      }
    }
    return;
  }

  if(e.target.closest('#resetProgress')){
    if(confirm('Setel ulang seluruh progres hafalan 82 Kotoba?')){
      Object.values(STORE).forEach(k => localStorage.removeItem(k));
      location.reload();
    }
    return;
  }

  const prevBtn = e.target.closest('#prevCard');
  if(prevBtn && !prevBtn.disabled){ 
    state.cardIndex = Math.max(0, state.cardIndex-1); 
    renderDeck(state.chapterId, state.groupId); 
    playCurrentCardTTS();
    return; 
  }

  const nextBtn = e.target.closest('#nextCard');
  if(nextBtn && !nextBtn.disabled){ 
    state.cardIndex = Math.min(state.order.length-1, state.cardIndex+1); 
    renderDeck(state.chapterId, state.groupId); 
    playCurrentCardTTS();
    return; 
  }

  const soundBtn = e.target.closest('.sound-btn');
  if(soundBtn){
    if(state.screen === 'quiz-play' && state.quiz && state.quiz.mode === 'type'){
      const card = state.quiz.questions[state.quiz.index].item.card;
      speakKana(card.kana);
      return;
    }
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    if (chap) {
      const g = chap.groups.find(gr => gr.id === state.groupId);
      if (g) {
        const card = g.cards[state.order[state.cardIndex]];
        if (card && card.words) {
          speakKana(card.words.map(w => w.jp).join('、'));
        }
      }
    }
    return;
  }

  const exBtn = e.target.closest('#excludeCard');
  if(exBtn){
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    if (chap) {
      const g = chap.groups.find(gr => gr.id === state.groupId);
      if (g) {
        const uid = cardUid(g.id, state.order[state.cardIndex]);
        if(excludedSet.has(uid)) excludedSet.delete(uid); else excludedSet.add(uid);
        saveExcluded();
        renderDeck(state.chapterId, state.groupId);
      }
    }
    return;
  }

  const cardEl = e.target.closest('#activeCard');
  if(cardEl){
    cardEl.classList.toggle('flipped');
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    if (chap) {
      const g = chap.groups.find(gr => gr.id === state.groupId);
      if (g) {
        const uid = cardUid(g.id, state.order[state.cardIndex]);
        if(cardEl.classList.contains('flipped') && !learnedSet.has(uid)){
          learnedSet.add(uid);
          cardEl.classList.add('is-learned');
          saveLearned();
        }
      }
    }
    return;
  }
});

/* ============================================================
   THEME & STREAK
   ============================================================ */
const app = document.getElementById('app');
const toggle = document.getElementById('themeToggle');
const knobIcon = document.getElementById('knobIcon');
const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moonPath = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';

function applyTheme(t){ app.setAttribute('data-theme', t); knobIcon.innerHTML = t==='dark' ? moonPath : sunPath; }
applyTheme(safeGet(STORE.theme, 'light'));
toggle.addEventListener('click', ()=>{ const next = app.getAttribute('data-theme')==='dark'?'light':'dark'; applyTheme(next); safeSet(STORE.theme, next); });

(function updateStreak(){
  const todayKey = new Date().toDateString();
  const lastVisit = safeGet(STORE.lastVisit, null);
  let streak = safeGet(STORE.streak, 0);
  if(lastVisit !== todayKey){
    const y = new Date(); y.setDate(y.getDate()-1);
    streak = (lastVisit === y.toDateString()) ? streak+1 : 1;
    safeSet(STORE.streak, streak); safeSet(STORE.lastVisit, todayKey);
  } else if(!streak){
    streak = 1; safeSet(STORE.streak, streak); safeSet(STORE.lastVisit, todayKey);
  }
})();

  p.style.animationDelay = (Math.random()*-10)+'s';

}
